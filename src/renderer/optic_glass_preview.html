<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAVE Sovereign Optical Glass & Tactile Motion Preview</title>
  <link rel="stylesheet" href="onboarding.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #181615;
      color: #23201E;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    /* Phone Device Mockup Container */
    .phone-bezel {
      width: 390px;
      height: 800px;
      background: #F8F3ED;
      border-radius: 54px;
      border: 12px solid #23201E;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), inset 0 0 0 2px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* iPhone Status Bar */
    .phone-status-bar {
      height: 44px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: #23201E;
      flex: none;
      z-index: 40;
    }

    .preview-controls {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .preview-btn {
      background: #2A2623;
      color: #F8F3ED;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .preview-btn:hover {
      background: #3A3531;
    }
  </style>
</head>
<body>

  <!-- Authentic Mobile Phone Frame -->
  <div class="phone-bezel">
    <div class="phone-status-bar">
      <span>11:51</span>
      <div style="display:flex; gap:6px; align-items:center;">
        <span style="font-size:11px;">5G</span>
        <span style="font-size:11px; background:rgba(0,0,0,0.1); padding:1px 4px; border-radius:4px;">29%</span>
      </div>
    </div>

    <!-- Wabi Full-Screen Experience Stage -->
    <div class="wabi-experience-stage" id="wabi-stage">
      <div class="wabi-top-notch">
        <div class="wabi-notch-pill"></div>
      </div>

      <!-- Canvas Host -->
      <div id="wabi-canvas-host" style="width:100%; flex:1; display:flex; align-items:center; justify-content:center; position:relative;"></div>

      <!-- Auth Dock -->
      <div class="wabi-auth-dock" id="wabi-auth-dock">
        <button type="button" class="wabi-auth-pill google" id="btn-google">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          <span>Continue with Google</span>
        </button>
        <button type="button" class="wabi-auth-pill apple" id="btn-apple">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 0.92-2.85-.9.04-2 .6-2.65 1.35-.58.66-1.09 1.73-.95 2.76 1.01.08 2.06-.51 2.68-1.26z"/></svg>
          <span>Continue with Apple</span>
        </button>
        <button type="button" class="wabi-link-btn" id="btn-reset">↺ Reset to "Swipe Up to Enter"</button>
      </div>
    </div>
  </div>

  <div class="preview-controls">
    <button type="button" class="preview-btn" id="ctrl-swipe-up">👆 Simulate Swipe Up</button>
    <button type="button" class="preview-btn" id="ctrl-reset">↺ Re-lock</button>
  </div>

  <script src="optic_glass_rig.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const host = document.getElementById('wabi-canvas-host');
      const authDock = document.getElementById('wabi-auth-dock');
      if (!host || !window.MaveOpticGlassRig) return;

      const rig = new window.MaveOpticGlassRig(host, {
        mode: 'wabi_intro',
        size: 366,
        aspect: 1.62,
        onUnlock: () => {
          if (authDock) authDock.classList.add('visible');
        },
      });

      const swipeBtn = document.getElementById('ctrl-swipe-up');
      if (swipeBtn) {
        swipeBtn.onclick = () => {
          rig.triggerUnlock();
        };
      }

      const resetBtn = document.getElementById('ctrl-reset');
      const resetLink = document.getElementById('btn-reset');
      const doReset = () => {
        rig.resetToIntro();
        if (authDock) authDock.classList.remove('visible');
      };
      if (resetBtn) resetBtn.onclick = doReset;
      if (resetLink) resetLink.onclick = doReset;
    });
  </script>
</body>
</html>
