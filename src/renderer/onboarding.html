<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="onboarding.css">
  <title>Welcome to MAVE</title>
</head>
<body class="theme-light" data-theme="light">
  <div class="window" id="onboarding-root"></div>
  <script src="optic_glass_rig.js"></script>
  <script src="onboarding_wizard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const root = document.getElementById('onboarding-root');
      if (root && window.OnboardingWizard) {
        const wiz = new window.OnboardingWizard(root);
        wiz.init();
      }
    });
  </script>
</body>
</html>
